name: Test

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aaa_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (SQLite)
        env:
          L3_HMAC_SECRET: test-secret-for-ci-do-not-use-in-production
          AAA_JWT_SECRET: 9f8e4d2a1b7c6e5f3a0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f
          DEBUG: "true"
          DATABASE_URL: sqlite:///./test_aaa_engine.db
        run: |
          cd backend
          pytest tests/ -v --tb=short

      - name: Run tests (PostgreSQL)
        env:
          L3_HMAC_SECRET: test-secret-for-ci-do-not-use-in-production
          AAA_JWT_SECRET: 9f8e4d2a1b7c6e5f3a0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f
          DEBUG: "true"
          DATABASE_URL: postgresql://test:test@localhost:5432/aaa_engine_test
        run: |
          cd backend
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check backend/ --output-format=github

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Run security scan
        run: bandit -r backend/app/ -ll -ii --format json --output bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker compose build --no-cache
          elif [ -f "Dockerfile" ]; then
            docker build -t aaa-engine:test .
          elif [ -f "backend/Dockerfile" ]; then
            docker build -t aaa-engine:test backend/
          else
            echo "No Dockerfile found, skipping build"
          fi

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "venv",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "S101",   # use of assert detected (OK in tests)
    "S104",   # possible binding to all interfaces
    "S603",   # subprocess call - check for shell=True
    "S607",   # starting a process with a partial path
    "S311",   # standard pseudo-random generators
    "UP042",  # class inherits from both str and Enum
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"test_*.py" = ["S101", "S105", "S106", "E402"]
"backend/tests/**/*.py" = ["S101", "S105", "S106"]
"backend/test_*.py" = ["S101", "S105", "S106", "E402"]
"backend/app/test_*.py" = ["S101", "S105", "S106", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
